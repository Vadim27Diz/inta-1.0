name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          externals: |
            src/styles/tokens.css
            src/styles/globals.css
            src/styles/**
            vite.config.ts
          # Пропуск — только для pull_request (заголовок PR или метка skip-chromatic), пуши в main
          # никогда не пропускаются: на них держится база снимков (baseline) для onlyChanged.
          skip: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[skip chromatic]') || contains(github.event.pull_request.labels.*.name, 'skip-chromatic')) }}
